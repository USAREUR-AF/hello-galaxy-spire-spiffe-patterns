# hello-galaxy SPIRE/SPIFFE federation — two real, independent trust domains.
#
#   core.galaxy     stands in for a goatnet SPIRE trust domain (the fabric core).
#   partner.galaxy  stands in for a partner moon-pod's OWN SPIRE trust domain.
#
# Each runs its OWN SPIRE server = its OWN root CA. They start trusting NOTHING of each
# other. The demo then federates them (exchange public bundles only) and proves that
# cross-domain trust appears ONLY because of that exchange — the knockout shows it absent
# without it. Self-contained: no agents, no live fabric; leaf SVIDs are minted directly with
# `spire-server x509 mint`. Image pinned by digest.

services:
  spire-core:
    image: ghcr.io/spiffe/spire-server:1.11.2@sha256:0ca091ecef5cbc19f2900a789f68ff5c00a31b056768468c6f2d4c3160a7f03c
    container_name: hg-spire-core
    user: "0:0"
    hostname: spire-core
    command: ["-config", "/run/spire/server.conf"]
    volumes:
      - ../spire/core/server.conf:/run/spire/server.conf:ro
      - core-data:/opt/spire/data
      - ../out/core:/opt/spire/out
    networks: [galaxy]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  spire-pod:
    image: ghcr.io/spiffe/spire-server:1.11.2@sha256:0ca091ecef5cbc19f2900a789f68ff5c00a31b056768468c6f2d4c3160a7f03c
    container_name: hg-spire-pod
    user: "0:0"
    hostname: spire-pod
    command: ["-config", "/run/spire/server.conf"]
    volumes:
      - ../spire/pod/server.conf:/run/spire/server.conf:ro
      - pod-data:/opt/spire/data
      - ../out/pod:/opt/spire/out
    networks: [galaxy]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  galaxy:
    name: hg-galaxy

volumes:
  core-data:
  pod-data:
