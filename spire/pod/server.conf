# partner.galaxy — stands in for a partner moon-pod's OWN SPIRE trust domain.
server {
    bind_address          = "0.0.0.0"
    bind_port             = "8081"
    trust_domain          = "partner.galaxy"
    data_dir              = "/opt/spire/data"
    log_level             = "INFO"
    ca_ttl                = "24h"
    default_x509_svid_ttl = "1h"

    # Federation: serve our public bundle, and (for auto-refresh) point at the partner's
    # endpoint. The deterministic demo bootstrap is a one-time manual `bundle set`; this
    # stanza is the production auto-refresh path once each side trusts the other.
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8443
        }
        federates_with "core.galaxy" {
            bundle_endpoint_url = "https://spire-core:8443"
            bundle_endpoint_profile "https_spiffe" {
                endpoint_spiffe_id = "spiffe://core.galaxy/spire/server"
            }
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }
    KeyManager "disk" {
        plugin_data { keys_path = "/opt/spire/data/keys.json" }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
}
